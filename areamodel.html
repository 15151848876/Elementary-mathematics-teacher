<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>面积模型渲染器 · 分数与百分数参数化</title>
<style>
:root{
  --ink:#12161f;--ink2:#3c465c;--muted:#7a8499;--line:#e4e8f1;
  --blue:#3b6cff;--blue-soft:#e9efff;--blue-deep:#2447c9;
  --orange:#ff8a3d;--orange-soft:#fff1e5;--orange-deep:#c2560e;
  --green:#0f9d67;--purple:#8a5cf6;--purple-soft:#f2ecff;--purple-deep:#5d34c4;
}
*{box-sizing:border-box}
body{margin:0;padding:26px 30px 40px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:radial-gradient(900px 500px at 8% -10%,#fff 0%,rgba(255,255,255,0) 62%),radial-gradient(760px 520px at 96% 4%,#f0ebff 0%,rgba(240,235,255,0) 60%),linear-gradient(160deg,#f8f9ff,#e9edf8);min-height:100vh}
header{max-width:1120px;margin:0 auto 18px}header h1{font-size:20px;margin:0 0 6px;letter-spacing:-.01em}header p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.7}header p b{color:var(--ink2)}
.grid{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:268px 420px 320px;gap:18px;align-items:start;justify-content:center}
.panel{background:rgba(255,255,255,.84);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.95);border-radius:20px;padding:18px;box-shadow:0 20px 50px -34px rgba(20,35,70,.45)}
.panel h2{font-size:10.5px;letter-spacing:.14em;color:#98a2b8;font-weight:700;margin:0 0 10px;text-transform:uppercase}.panel h2:not(:first-child){margin-top:18px}
.kinds{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:14px}.kinds button{font-family:inherit;font-size:12px;font-weight:650;color:var(--muted);background:#fff;border:1.3px solid var(--line);border-radius:10px;padding:9px 8px;cursor:pointer;transition:.16s;text-align:left}.kinds button:hover{border-color:#c9d5f2}.kinds button.on{background:var(--blue-soft);border-color:#a9c0ff;color:var(--blue-deep)}
.field{display:flex;align-items:center;gap:8px;margin-bottom:8px}.field label{font-size:11.5px;color:var(--muted);width:62px;font-weight:600;flex:0 0 auto}.field input{flex:1;min-width:0;font-family:inherit;font-size:16px;font-weight:600;color:var(--ink);border:1.4px solid var(--line);border-radius:9px;padding:7px 10px;outline:none;transition:.18s;background:#fff;font-variant-numeric:tabular-nums}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,108,255,.12)}
.row{display:flex;gap:8px;margin-top:10px}.btn{flex:1;font-family:inherit;font-size:12.5px;font-weight:650;border-radius:10px;padding:9px 12px;border:1px solid transparent;cursor:pointer;transition:.18s}.btn.primary{background:linear-gradient(135deg,#4a76ff,#3b5ae8);color:#fff;box-shadow:0 8px 18px -10px rgba(59,108,255,.9)}.btn.primary:hover{filter:brightness(1.05)}.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink2)}.btn.ghost:hover{border-color:#c9d5f2}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-top:10px;cursor:pointer;user-select:none}.chk input{accent-color:var(--blue);width:14px;height:14px}
.notice{font-size:10.5px;line-height:1.6;color:var(--orange-deep);background:var(--orange-soft);border:1px solid #ffe0c4;border-radius:8px;padding:7px 9px;margin-top:10px;display:none}.notice.on{display:block}
.steps{display:flex;flex-direction:column;gap:4px;max-height:290px;overflow-y:auto}.steps::-webkit-scrollbar{width:4px}.steps::-webkit-scrollbar-thumb{background:#dde3ef;border-radius:4px}.stepitem{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;line-height:1.55;color:var(--muted);padding:6px 8px;border-radius:8px;cursor:pointer;transition:.15s;border:1px solid transparent}.stepitem:hover{background:#f5f8ff}.stepitem.on{background:var(--blue-soft);border-color:#cfdcff;color:var(--blue-deep);font-weight:600}.stepitem .n{width:15px;height:15px;border-radius:50%;background:#eef1f8;color:#98a2b8;font-size:9px;display:grid;place-items:center;flex:0 0 auto;margin-top:1px;font-weight:700}.stepitem.on .n{background:var(--blue);color:#fff}.stepitem.ask .n{background:var(--orange-soft);color:var(--orange-deep)}.stepitem.ask.on .n{background:var(--orange);color:#fff}
.stage{display:flex;flex-direction:column;gap:12px}.board{background-color:#fff;border-radius:20px;border:1px solid var(--line);background-image:radial-gradient(circle,#eceffa 1px,transparent 1px);background-size:17px 17px;padding:10px 12px;box-shadow:0 24px 60px -40px rgba(20,35,70,.5);overflow:hidden}.board svg{width:100%;height:auto;display:block;max-height:440px}
.narr{background:rgba(255,255,255,.84);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.95);border-radius:16px;padding:13px 15px;box-shadow:0 16px 40px -34px rgba(20,35,70,.4);min-height:74px}.narr .k{font-size:10px;font-weight:700;color:var(--blue);letter-spacing:.12em;margin-bottom:5px}.narr p{margin:0;font-size:13px;line-height:1.7;color:var(--ink2)}
.askcard{background:linear-gradient(180deg,#fffdf8,#fff8ef);border:1px solid #ffdcbb;border-radius:14px;padding:12px 14px}.askcard.ok{background:linear-gradient(180deg,#f6fdf9,#eefaf3);border-color:#b9e6d0}.askq{font-size:12.5px;font-weight:600;color:#8a4b0d;margin-bottom:9px;line-height:1.55}.askq span{display:inline-block;font-size:10px;background:var(--orange);color:#fff;padding:1.5px 6px;border-radius:5px;margin-right:6px;vertical-align:1px;font-weight:700}.askcard.ok .askq{color:#0b7d52}.askcard.ok .askq span{background:var(--green)}.opts{display:flex;gap:7px;flex-wrap:wrap}.opt{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink2);background:#fff;border:1.4px solid #ecd9c5;border-radius:9px;padding:7px 13px;cursor:pointer;transition:.16s}.opt:hover{border-color:var(--orange);color:var(--orange-deep)}.opt.right{background:var(--green);border-color:var(--green);color:#fff}.opt.wrong{border-color:#f0a9a9;color:#c0392b;background:#fff6f6;text-decoration:line-through;opacity:.75}
.player{display:flex;align-items:center;gap:10px}.pbtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:15px;cursor:pointer;display:grid;place-items:center;transition:.16s}.pbtn:hover:not(:disabled){border-color:#c9d5f2;color:var(--blue)}.pbtn:disabled{opacity:.35;cursor:not-allowed}.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap;max-width:250px;margin:0 auto}.dots i{width:6px;height:6px;border-radius:50%;background:#d3dae8;transition:.22s;cursor:pointer}.dots i.on{width:18px;border-radius:3px;background:var(--blue)}.dots i.done{background:#b9c8ee}
.code pre{margin:0;background:#0f1420;color:#c3d2ef;border-radius:12px;padding:13px 14px;font-size:10.5px;line-height:1.72;overflow:auto;max-height:360px;font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}.code pre::-webkit-scrollbar{width:5px;height:5px}.code pre::-webkit-scrollbar-thumb{background:#2a3348;border-radius:4px}.k{color:#7aa2ff}.s{color:#8ee0b0}.n{color:#ffb877}.c{color:#5f6b85}.selfcheck{margin-top:12px;font-size:11px;line-height:1.65;color:var(--muted);padding:9px 11px;border-radius:9px;background:#f4f7fd;border:1px solid #e6ecf8}.selfcheck b{color:var(--green);font-weight:700}.hint{margin-top:12px;padding-top:11px;border-top:1px dashed rgba(150,165,195,.35);font-size:11px;line-height:1.75;color:var(--muted)}.hint em{font-style:normal;color:var(--purple-deep);font-weight:600}
.cell{opacity:0;transform:scale(.88);transform-box:fill-box;transform-origin:center;transition:opacity .32s,transform .42s cubic-bezier(.22,.86,.3,1)}.cell.on{opacity:1;transform:scale(1)}.cell.blue{fill:#c9d8ff;stroke:#8fb0f5}.cell.orange{fill:#ffd7b5;stroke:#f0b184}.cell.green{fill:#bfead6;stroke:#74c69d}.cell.ghost{fill:#fff;stroke:#aab5c9;stroke-dasharray:4 3;opacity:0}.cell.ghost.on{opacity:1}.cellline{stroke:#fff;stroke-width:1.5;opacity:0;transition:opacity .3s}.cellline.on{opacity:1}.glabel{font-size:11px;fill:#5b6478;font-weight:600;text-anchor:middle;opacity:0;transition:opacity .3s}.glabel.on{opacity:1}.fraction{font-size:18px;font-weight:700;text-anchor:middle;fill:#273554;opacity:0;transition:opacity .3s}.fraction.on{opacity:1}.fraction.blue{fill:var(--blue-deep)}.fraction.orange{fill:var(--orange-deep)}.fraction.green{fill:var(--green)}.eqline{font-size:14px;font-weight:700;text-anchor:middle;fill:var(--purple-deep);opacity:0;transition:opacity .35s}.eqline.on{opacity:1}.eqline.fin{fill:var(--green)}.arrow{stroke:var(--purple);stroke-width:2;stroke-linecap:round;opacity:0;transition:opacity .3s}.arrow.on{opacity:1}.arrowhead{fill:var(--purple);opacity:0;transition:opacity .3s}.arrowhead.on{opacity:1}.legend{font-size:10.5px;fill:#7a8499;text-anchor:middle;opacity:0;transition:opacity .3s}.legend.on{opacity:1}
@media(max-width:980px){body{padding:18px 12px}.grid{grid-template-columns:268px minmax(360px,420px);justify-content:center}.code{grid-column:1 / -1}.code pre{max-height:240px}}
@media(max-width:700px){.grid{grid-template-columns:minmax(280px,420px)}.panel.code{grid-column:auto}header{padding:0 2px}}
</style>
</head>
<body>
<header>
  <h1>面积模型渲染器 · 分数与百分数参数化</h1>
  <p>面积模型的重点不是格子，而是让孩子看见：<b>同样大小的一份，数清楚取了几份</b>。通分、分数乘整数、百分数转小数，都能归结成同一件事。</p>
</header>
<div class="grid">
  <section class="panel">
    <h2>题型</h2>
    <div class="kinds" id="kinds">
      <button data-k="fracadd" class="on">分数加法</button>
      <button data-k="fracmul">分数 × 整数</button>
      <button data-k="pct">百分数 → 小数</button>
    </div>
    <h2>参数</h2><div id="fields"></div>
    <div class="row"><button class="btn primary" id="btnRun">换这题</button><button class="btn ghost" id="btnRand">随机</button></div>
    <label class="chk"><input type="checkbox" id="chkAsk" checked/>插入「想一想」关卡</label>
    <label class="chk"><input type="checkbox" id="chkAuto"/>自动播放</label>
    <div class="notice" id="notice"></div>
    <h2>步骤</h2><div class="steps" id="stepList"></div>
  </section>
  <section class="stage">
    <div class="board" id="board"></div>
    <div class="narr"><div class="k" id="narrK">第 1 步</div><p id="narrT">—</p></div>
    <div id="askHost"></div>
    <div class="player"><button class="pbtn" id="btnPrev">‹</button><div class="dots" id="dots"></div><button class="pbtn" id="btnNext">›</button></div>
  </section>
  <section class="panel code">
    <h2>模型输出</h2><pre id="json"></pre><div class="selfcheck" id="selfcheck"></div>
    <div class="hint"><em>关键点：</em>模型只负责识别题型和数字；分格数量、每格代表什么、最后答案，都由面积模型引擎确定性推导。</div>
  </section>
</div>
<script>
const $=s=>document.querySelector(s), UNIT='';
const KINDS={
  fracadd:{fields:[['a','分子 1',1],['b','分母 1',2],['c','分子 2',1],['d','分母 2',3]]},
  fracmul:{fields:[['a','分子',2],['b','分母',5],['n','乘整数',3]]},
  pct:{fields:[['p','百分数',25]]}
};
let kind='fracadd',cur=null,idx=0,answers={},timer=null;
const board=$('#board'),stepList=$('#stepList'),dotsEl=$('#dots'),askHost=$('#askHost'),notice=$('#notice');
function gcd(a,b){while(b){[a,b]=[b,a%b]}return Math.abs(a)}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b)}
function frac(n,d){const g=gcd(n,d);return [n/g,d/g]}
function fields(){
 $('#fields').innerHTML=KINDS[kind].fields.map(([k,l,v])=>`<div class="field"><label>${l}</label><input id="f_${k}" type="number" min="1" max="100" value="${v}"/></div>`).join('');
 $('#fields').querySelectorAll('input').forEach(x=>x.onkeydown=e=>{if(e.key==='Enter')run()});
}
function params(){const v={};KINDS[kind].fields.forEach(([k])=>v[k]=Math.max(1,Math.min(100,Math.round(+$('#f_'+k).value||1))));return v}
function plannerFracAdd(a,b,c,d){
 let warn=''; if(a>=b||c>=d){a=Math.min(a,b-1);c=Math.min(c,d-1);warn='分子必须小于分母，已自动调整为真分数。'}
 const L=lcm(b,d),A=a*(L/b),C=c*(L/d),sum=A+C,[rn,rd]=frac(sum,L);
 const cells=Array.from({length:L},(_,i)=>({kind:i<A?'blue':(i<A+C?'orange':'ghost')}));
 const steps=[
  {mode:'base',visible:Math.min(b,d),say:`先看 1/${b} 和 1/${d}：它们都表示“取 1 份”，但每份大小不一样。`},
  {mode:'grid',visible:L,say:`把整块平均分成 ${L} 份。${L} 是 ${b} 和 ${d} 的公倍数，这样两份就一样大了。`},
  {mode:'a',visible:A,show:'blue',say:`1/${b} = ${A}/${L}：原来的 1 份被切成 ${A} 个小份。`},
  {mode:'b',visible:L,show:'both',say:`1/${d} = ${C}/${L}：第二个分数取 ${C} 个同样大小的小份。`},
  {mode:'ask',visible:L,show:'both',ask:{q:`现在一共涂了几小格？${A} + ${C} = ?`,opts:[`${sum}`,`${L}`,`${A}`],a:0},hint:`蓝色 ${A} 格 + 橙色 ${C} 格 = ${sum} 格，所以分子相加，分母不变。`},
  {mode:'sum',visible:L,show:'both',eq:`${A}/${L} + ${C}/${L} = ${sum}/${L} = ${rn}/${rd}`,eqCls:'fin',say:`同样大小的小格可以直接数：${A} + ${C} = ${sum}，结果是 ${sum}/${L}，约分后是 ${rn}/${rd}。`}
 ];
 return {type:'fracadd',title:'异分母分数加法',params:{a,b,c,d,L,A,C},cells,steps,answer:`${rn}/${rd}`,warn};
}
function plannerFracMul(a,b,n){
 const raw=a*n,[rn,rd]=frac(raw,b),rows=n,cols=b;
 const steps=[
  {mode:'base',count:0,say:`先看 1 个 ${a}/${b}：把整块平均分成 ${b} 份，取其中 ${a} 份。`},
  {mode:'copies',count:n,say:`乘 3 的意思是有 ${n} 个一样大的 ${a}/${b}。面积模型把它们一行一行排出来。`},
  {mode:'ask',count:n,ask:{q:`每行有 ${a} 个涂色小格，${n} 行一共有多少格？`,opts:[`${raw}`,`${a+b}`,`${n}`],a:0},hint:`每行 ${a} 格，共 ${n} 行：${a} × ${n} = ${raw} 格。`},
  {mode:'sum',count:n,eq:`${a}/${b} × ${n} = ${raw}/${b} = ${rn}/${rd}`,eqCls:'fin',say:`一共涂了 ${raw} 格，每行有 ${b} 格，所以结果是 ${raw}/${b}，约分后是 ${rn}/${rd}。`}
 ];
 return {type:'fracmul',title:'分数乘整数',params:{a,b,n},cells:{a,b,n,rows,cols},steps,answer:`${rn}/${rd}`,warn:''};
}
function plannerPct(p){
 p=Math.min(100,Math.max(1,p));const whole=Math.floor(p/10),rest=p%10,decimal=(p/100).toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
 const steps=[
  {mode:'base',visible:0,say:`百分数的“%”就是“每 100 份”。所以先把整块平均分成 100 个小格。`},
  {mode:'grid',visible:100,say:`这是一块完整的 1，也就是 100/100。每一个小格代表 1/100 = 0.01。`},
  {mode:'fill',visible:p,eq:`${p}% = ${p}/100`,say:`涂 ${p} 个小格，就是 ${p}/100。百分号可以换成“除以 100”。`},
  {mode:'ask',visible:p,ask:{q:`${p}/100 写成小数，小数点要向左移动几位？`,opts:['2 位', '1 位', '不移动'],a:0},hint:`除以 100，小数点向左移动 2 位：${p}/100 = ${decimal}。`},
  {mode:'sum',visible:p,eq:`${p}% = ${p}/100 = ${decimal}`,eqCls:'fin',say:`${p}% = ${p}/100 = ${decimal}。记住：百分号换成小数，小数点向左移动 2 位。`}
 ];
 return {type:'pct',title:'百分数转小数',params:{p},cells:{p,whole,rest},steps,answer:decimal,warn:''};
}
function buildSvg(model){
 if(model.type==='fracadd') return svgFracAdd(model);
 if(model.type==='fracmul') return svgFracMul(model);
 return svgPct(model);
}
function svgFracAdd(m){
 const W=400,H=350,L=m.params.L,x=42,y=82,w=300,h=72,cw=w/L;
 let s=`<svg viewBox="0 0 ${W} ${H}"><text class="legend" id="leg" x="200" y="28">整块 = 1，平均分成 ${L} 份</text>`;
 for(let i=0;i<L;i++){let cell=m.cells[i],xx=x+i*cw;s+=`<rect class="cell ${cell.kind}" id="c${i}" x="${xx}" y="${y}" width="${Math.max(cw,1)}" height="${h}" rx="${cw>8?2:0}"/>`;if(i>0)s+=`<line class="cellline" id="l${i}" x1="${xx}" y1="${y+2}" x2="${xx}" y2="${y+h-2}"/>`}
 s+=`<text class="glabel" id="lab" x="${x+w+28}" y="${y+h/2+4}">${L} 份</text><text class="fraction blue" id="fA" x="${x+88}" y="208">${m.params.a}/${m.params.b}</text><text class="fraction orange" id="fB" x="${x+200}" y="208">${m.params.c}/${m.params.d}</text><text class="fraction green" id="fS" x="200" y="260">${m.answer}</text><text class="eqline" id="eq" x="200" y="312"></text></svg>`;return s;
}
function svgFracMul(m){
 const W=400,H=370,b=m.cells.b,n=m.cells.n,x=52,y=52,w=292,h=Math.min(250,n*46),cw=w/b,rh=h/n;
 let s=`<svg viewBox="0 0 ${W} ${H}"><text class="legend" id="leg" x="200" y="28">每一行 = 1 个 ${m.cells.a}/${b}</text>`;
 for(let r=0;r<n;r++)for(let c=0;c<b;c++){let fill=c<m.cells.a?'blue':'ghost',xx=x+c*cw,yy=y+r*rh;s+=`<rect class="cell ${fill}" id="c${r}_${c}" x="${xx}" y="${yy}" width="${Math.max(cw,1)}" height="${Math.max(rh,1)}"/>`;if(c>0)s+=`<line class="cellline" id="l${r}_${c}" x1="${xx}" y1="${yy+1}" x2="${xx}" y2="${yy+rh-1}"/>`}
 s+=`<text class="glabel" id="lab" x="${x+w+30}" y="${y+h/2+4}">${n} 行</text><text class="fraction blue" id="fA" x="200" y="${y+h+38}">${m.cells.a}/${b} × ${n}</text><text class="eqline" id="eq" x="200" y="${y+h+78}"></text></svg>`;return s;
}
function svgPct(m){
 const W=400,H=365,x=86,y=42,side=228,cell=side/10;
 let s=`<svg viewBox="0 0 ${W} ${H}"><text class="legend" id="leg" x="200" y="25">整块 = 100% = 1</text>`;
 for(let r=0;r<10;r++)for(let c=0;c<10;c++){let i=r*10+c,fill=i<m.cells.p?'orange':'ghost',xx=x+c*cell,yy=y+r*cell;s+=`<rect class="cell ${fill}" id="c${i}" x="${xx}" y="${yy}" width="${cell}" height="${cell}"/>`}
 s+=`<text class="fraction orange" id="fA" x="200" y="315">${m.cells.p}%</text><text class="eqline" id="eq" x="200" y="350"></text></svg>`;return s;
}
function run(){
 const v=params(),withAsk=$('#chkAsk').checked;let m;
 if(kind==='fracadd')m=plannerFracAdd(v.a,v.b,v.c,v.d);else if(kind==='fracmul')m=plannerFracMul(v.a,v.b,v.n);else m=plannerPct(v.p);
 notice.textContent=m.warn;notice.classList.toggle('on',!!m.warn);board.innerHTML=buildSvg(m);cur={...m,steps:m.steps.filter(s=>withAsk||!s.ask)};answers={};idx=0;buildStepList();paint();renderJson();
}
function buildStepList(){stepList.innerHTML='';dotsEl.innerHTML='';cur.steps.forEach((s,i)=>{const d=document.createElement('div');d.className='stepitem'+(s.ask?' ask':'');d.innerHTML=`<span class="n">${s.ask?'?':i+1}</span><span>${s.ask?s.ask.q:s.say}</span>`;d.onclick=()=>{idx=i;paint()};stepList.appendChild(d);const dot=document.createElement('i');dot.onclick=()=>{idx=i;paint()};dotsEl.appendChild(dot)})}
function setCells(ids,on){ids.forEach(id=>{const e=document.getElementById(id);if(e)e.classList.toggle('on',on)})}
function paint(){const s=cur.steps[idx];document.querySelectorAll('.cell,.cellline,.legend,.fraction,.glabel').forEach(e=>e.classList.remove('on'));const m=cur;
 if(m.type==='fracadd'){
  $('#leg').classList.add('on');const L=m.params.L,A=m.params.A,C=m.params.C;
  if(s.mode==='base'){for(let i=0;i<Math.min(m.params.b,m.params.d);i++)document.getElementById('c'+i)?.classList.add('on')}
  if(['grid','a','b','ask','sum'].includes(s.mode)){for(let i=0;i<L;i++){document.getElementById('c'+i)?.classList.add('on');if(i)document.getElementById('l'+i)?.classList.add('on')}}
  if(['a','b','ask','sum'].includes(s.mode))for(let i=0;i<A;i++)document.getElementById('c'+i)?.classList.add('blue','on');

(function selfCheck(){let bad=0,total=0;for(let i=0;i<300;i++){let a=1+Math.floor(Math.random()*8),b=2+Math.floor(Math.random()*9),c=1+Math.floor(Math.random()*8),d=2+Math.floor(Math.random()*9);if(a>=b)a=b-1;if(c>=d)c=d-1;const m=plannerFracAdd(a,b,c,d);const [en,ed]=frac(a*d+c*b,b*d);const [gn,gd]=m.answer.split('/').map(Number);total++;if(gn!==en||gd!==ed)bad++;let x=1+Math.floor(Math.random()*8),y=2+Math.floor(Math.random()*9),n=1+Math.floor(Math.random()*5),mm=plannerFracMul(Math.min(x,y-1),y,n);const [mn,md]=mm.answer.split('/').map(Number);total++;if(mn!==frac(Math.min(x,y-1)*n,y)[0]||md!==frac(Math.min(x,y-1)*n,y)[1])bad++;let p=1+Math.floor(Math.random()*99),pm=plannerPct(p);total++;if(Math.abs(+pm.answer-p/100)>1e-9)bad++}$('#selfcheck').innerHTML=bad===0?`<b>自检通过</b>　3 类题型各 300 组随机参数，约分和答案全部可验证。<br/>分格、涂色、等式由参数确定性生成。`:`<span style="color:#c0392b">自检失败 ${bad}/${total}</span>`})();
