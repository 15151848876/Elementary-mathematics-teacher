<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>线段图渲染器 · 应用题参数化</title>
<style>
:root{
  --ink:#12161f; --ink2:#3c465c; --muted:#7a8499;
  --line:#e4e8f1;
  --blue:#3b6cff; --blue-soft:#e9efff; --blue-deep:#2447c9;
  --orange:#ff8a3d; --orange-soft:#fff1e5; --orange-deep:#c2560e;
  --green:#0f9d67;
  --purple:#8a5cf6; --purple-soft:#f2ecff; --purple-deep:#5d34c4;
}
*{box-sizing:border-box}
body{
  margin:0;padding:26px 30px 40px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 500px at 8% -10%,#ffffff 0%,rgba(255,255,255,0) 62%),
    radial-gradient(760px 520px at 96% 4%,#f0ebff 0%,rgba(240,235,255,0) 60%),
    linear-gradient(160deg,#f8f9ff,#e9edf8);
  min-height:100vh;
}
header{max-width:1120px;margin:0 auto 18px}
header h1{font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
header p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.7}
header p b{color:var(--ink2)}

.grid{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:268px 420px 320px;gap:18px;align-items:start;justify-content:center}

.panel{
  background:rgba(255,255,255,.84);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.95);border-radius:20px;padding:18px;
  box-shadow:0 20px 50px -34px rgba(20,35,70,.45);
}
.panel h2{font-size:10.5px;letter-spacing:.14em;color:#98a2b8;font-weight:700;margin:0 0 10px;text-transform:uppercase}
.panel h2:not(:first-child){margin-top:18px}

.kinds{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.kinds button{
  font-family:inherit;font-size:12px;font-weight:650;color:var(--muted);
  background:#fff;border:1.3px solid var(--line);border-radius:10px;padding:9px 4px;
  cursor:pointer;transition:.16s;line-height:1.3;
}
.kinds button:hover{border-color:#c9d5f2}
.kinds button.on{background:var(--blue-soft);border-color:#a9c0ff;color:var(--blue-deep)}

.field{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.field label{font-size:11.5px;color:var(--muted);width:46px;font-weight:600;flex:0 0 auto}
.field input{
  flex:1;min-width:0;font-family:inherit;font-size:16px;font-weight:600;color:var(--ink);
  border:1.4px solid var(--line);border-radius:9px;padding:7px 10px;outline:none;
  transition:.18s;background:#fff;font-variant-numeric:tabular-nums;
}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,108,255,.12)}

.row{display:flex;gap:8px;margin-top:10px}
.btn{
  flex:1;font-family:inherit;font-size:12.5px;font-weight:650;border-radius:10px;
  padding:9px 12px;border:1px solid transparent;cursor:pointer;transition:.18s;
}
.btn.primary{background:linear-gradient(135deg,#4a76ff,#3b5ae8);color:#fff;box-shadow:0 8px 18px -10px rgba(59,108,255,.9)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink2)}
.btn.ghost:hover{border-color:#c9d5f2}

.chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-top:10px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--blue);width:14px;height:14px}

.notice{
  font-size:10.5px;line-height:1.6;color:var(--orange-deep);background:var(--orange-soft);
  border:1px solid #ffe0c4;border-radius:8px;padding:7px 9px;margin-top:10px;display:none;
}
.notice.on{display:block}

.steps{display:flex;flex-direction:column;gap:4px;max-height:262px;overflow-y:auto}
.steps::-webkit-scrollbar{width:4px}
.steps::-webkit-scrollbar-thumb{background:#dde3ef;border-radius:4px}
.stepitem{
  display:flex;gap:8px;align-items:flex-start;font-size:11.5px;line-height:1.55;color:var(--muted);
  padding:6px 8px;border-radius:8px;cursor:pointer;transition:.15s;border:1px solid transparent;
}
.stepitem:hover{background:#f5f8ff}
.stepitem.on{background:var(--blue-soft);border-color:#cfdcff;color:var(--blue-deep);font-weight:600}
.stepitem .n{
  width:15px;height:15px;border-radius:50%;background:#eef1f8;color:#98a2b8;
  font-size:9px;display:grid;place-items:center;flex:0 0 auto;margin-top:1px;font-weight:700;
}
.stepitem.on .n{background:var(--blue);color:#fff}
.stepitem.ask .n{background:var(--orange-soft);color:var(--orange-deep)}
.stepitem.ask.on .n{background:var(--orange);color:#fff}

.stage{display:flex;flex-direction:column;gap:12px}
.board{
  background-color:#fff;border-radius:20px;border:1px solid var(--line);
  background-image:radial-gradient(circle,#eceffa 1px,transparent 1px);
  background-size:17px 17px;padding:8px 10px;
  box-shadow:0 24px 60px -40px rgba(20,35,70,.5);overflow:hidden;
}
.board svg{width:100%;height:auto;display:block;max-height:430px}

.narr{background:rgba(255,255,255,.84);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.95);
  border-radius:16px;padding:13px 15px;box-shadow:0 16px 40px -34px rgba(20,35,70,.4);min-height:74px}
.narr .k{font-size:10px;font-weight:700;color:var(--blue);letter-spacing:.12em;margin-bottom:5px}
.narr p{margin:0;font-size:13px;line-height:1.7;color:var(--ink2)}

.askcard{background:linear-gradient(180deg,#fffdf8,#fff8ef);border:1px solid #ffdcbb;border-radius:14px;padding:12px 14px}
.askcard.ok{background:linear-gradient(180deg,#f6fdf9,#eefaf3);border-color:#b9e6d0}
.askq{font-size:12.5px;font-weight:600;color:#8a4b0d;margin-bottom:9px;line-height:1.55}
.askq span{display:inline-block;font-size:10px;background:var(--orange);color:#fff;padding:1.5px 6px;border-radius:5px;margin-right:6px;vertical-align:1px;font-weight:700}
.askcard.ok .askq{color:#0b7d52}
.askcard.ok .askq span{background:var(--green)}
.opts{display:flex;gap:7px;flex-wrap:wrap}
.opt{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink2);background:#fff;
  border:1.4px solid #ecd9c5;border-radius:9px;padding:7px 13px;cursor:pointer;transition:.16s}
.opt:hover{border-color:var(--orange);color:var(--orange-deep)}
.opt.right{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:#f0a9a9;color:#c0392b;background:#fff6f6;text-decoration:line-through;opacity:.75}

.player{display:flex;align-items:center;gap:10px}
.pbtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:#fff;
  color:var(--ink2);font-size:15px;cursor:pointer;display:grid;place-items:center;transition:.16s}
.pbtn:hover:not(:disabled){border-color:#c9d5f2;color:var(--blue)}
.pbtn:disabled{opacity:.35;cursor:not-allowed}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap;max-width:250px;margin:0 auto}
.dots i{width:6px;height:6px;border-radius:50%;background:#d3dae8;transition:.22s;cursor:pointer}
.dots i.on{width:18px;border-radius:3px;background:var(--blue)}
.dots i.done{background:#b9c8ee}

.code pre{
  margin:0;background:#0f1420;color:#c3d2ef;border-radius:12px;padding:13px 14px;
  font-size:10.5px;line-height:1.72;overflow:auto;max-height:340px;
  font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
.code pre::-webkit-scrollbar{width:5px;height:5px}
.code pre::-webkit-scrollbar-thumb{background:#2a3348;border-radius:4px}
.k{color:#7aa2ff}.s{color:#8ee0b0}.n{color:#ffb877}.c{color:#5f6b85}

.selfcheck{
  margin-top:12px;font-size:11px;line-height:1.65;color:var(--muted);
  padding:9px 11px;border-radius:9px;background:#f4f7fd;border:1px solid #e6ecf8;
}
.selfcheck b{color:var(--green);font-weight:700}
.hint{margin-top:12px;padding-top:11px;border-top:1px dashed rgba(150,165,195,.35);font-size:11px;line-height:1.75;color:var(--muted)}
.hint em{font-style:normal;color:var(--purple-deep);font-weight:600}

/* ---------- SVG ---------- */
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);opacity:0;
  transition:transform .5s cubic-bezier(.22,.86,.3,1),opacity .28s}
.bar.on{transform:scaleX(1);opacity:1}
.bar.gst{stroke-dasharray:4 3;opacity:0}
.bar.gst.on{opacity:.8}

.rlabel{font-size:12px;fill:#5b6478;font-weight:600;text-anchor:end;opacity:0;transition:opacity .3s}
.rlabel.on{opacity:1}

.btext{font-size:11.5px;font-weight:650;text-anchor:middle;pointer-events:none;opacity:0;transition:opacity .3s}
.btext.on{opacity:1}
.btext.a{fill:#25419e}
.btext.b{fill:#8a4b0d}
.btext.g{fill:#0b7d52}
.vcol{font-size:11.5px;font-weight:700;fill:#0b7d52;text-anchor:end;opacity:0;transition:opacity .32s;font-variant-numeric:tabular-nums}
.vcol.on{opacity:1}

.brace{opacity:0;transition:opacity .35s}
.brace.on{opacity:1}
.brace path{fill:none;stroke:#9aa3b8;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.brace.diff path{stroke:var(--orange)}
.brace.total path{stroke:#6b7488}
.brace.hi path{stroke:var(--green)}
.brace text{font-size:11px;text-anchor:middle;fill:#6b7488;font-weight:600}
.brace.diff text{fill:var(--orange-deep)}
.brace.hi text{fill:#0b7d52}

.divider{stroke:#fff;stroke-width:1.8;opacity:0;transition:opacity .3s}
.divider.on{opacity:.95}

.eqline{font-size:13px;font-weight:650;text-anchor:middle;fill:var(--purple-deep);opacity:0;transition:opacity .35s}
.eqline.on{opacity:1}
.eqline.fin{fill:#0b7d52}
</style>
</head>
<body>

<header>
  <h1>线段图渲染器 · 应用题参数化</h1>
  <p>应用题最难的不是算，是<b>把文字翻译成图</b>。这四类题的关系结构固定，所以图可以完全由参数推导 —— 长度严格成比例。</p>
</header>

<div class="grid">

  <section class="panel">
    <h2>题型</h2>
    <div class="kinds" id="kinds">
      <button data-k="more" class="on">多几少几</button>
      <button data-k="sumdiff">和差问题</button>
      <button data-k="summul">和倍问题</button>
      <button data-k="diffmul">差倍问题</button>
    </div>

    <h2>参数</h2>
    <div id="fields"></div>

    <div class="row">
      <button class="btn primary" id="btnRun">换这题</button>
      <button class="btn ghost" id="btnRand">随机</button>
    </div>

    <label class="chk"><input type="checkbox" id="chkAsk" checked/>插入「想一想」关卡</label>
    <label class="chk"><input type="checkbox" id="chkAuto"/>自动播放</label>

    <div class="notice" id="notice"></div>

    <h2>步骤</h2>
    <div class="steps" id="stepList"></div>
  </section>

  <section class="stage">
    <div class="board" id="board"></div>
    <div class="narr">
      <div class="k" id="narrK">第 1 步</div>
      <p id="narrT">—</p>
    </div>
    <div id="askHost"></div>
    <div class="player">
      <button class="pbtn" id="btnPrev">‹</button>
      <div class="dots" id="dots"></div>
      <button class="pbtn" id="btnNext">›</button>
    </div>
  </section>

  <section class="panel code">
    <h2>模型输出</h2>
    <pre id="json"></pre>
    <div class="selfcheck" id="selfcheck"></div>
    <div class="hint">
      <em>关键点：</em>线段图不是"画得像"，是<b>长度必须成比例</b>。所有取值按同一把尺子换算，
      孩子看到的"长一点"才真的等于"多一点"。
    </div>
  </section>

</div>

<script>
const UNIT = '颗';

/* =========================================================
   规划器工具：渐进式累积可见元素
   ========================================================= */
function builder(){
  const V = [], B = [];
  return {
    add(...ids){ ids.forEach(i => { if(!V.includes(i)) V.push(i); }); },
    addRow(row){ V.push(row.id + 'l'); row.segs.forEach((_, j) => V.push(row.id + 's' + j)); },
    brace(...ids){ ids.forEach(i => { if(!B.includes(i)) B.push(i); }); },
    snap(){ return V.slice(); },
    bs(){ return B.slice(); }
  };
}

/* ---- 多几少几 ---- */
function P_more(a, d, u){
  const b = a + d, total = a + b;
  const rows = [
    { id: 'r0', label: '小明', v: `${a}`, segs: [{ n: a, t: '已知', c: 'a' }] },
    { id: 'r1', label: '小红', v: `${b}`, segs: [{ n: a, t: '', c: 'a' }, { n: d, t: `+${d}`, c: 'b' }] },
    { id: 'r2', label: '一共', v: `${total}`, segs: [{ n: a, t: '', c: 'a' }, { n: b, t: '', c: 'b' }] }
  ];
  const braces = [
    { id: 'bd', row: 1, u1: a, u2: a + d, label: `多 ${d}`, side: 'above', cls: 'diff' },
    { id: 'bt', row: 2, u1: 0, u2: a + b, label: `一共 ?`, side: 'below', cls: 'total', hideOnFinal: 1 }
  ];
  const B = builder();

  B.add('r0l'); B.add('r0s0'); B.add('r0v');
  const s1 = B.snap();
  const st = [{ v: s1, say: `小明有 ${a} ${u}，就用一条线段表示。线段有多长，就代表有多少 ${u}。` }];

  B.add('r1l'); B.add('r1s0');
  const s2 = B.snap();
  st.push({ v: s2, say: `小红比小明多，说明她至少有和小明一样多的那一段。先照着画一段一样长的。` });

  B.add('r1s1'); B.brace('bd');
  const s3 = B.snap();
  st.push({ v: s3, b: B.bs(), say: `「多 ${d}」就在后面再接一小段。所以小红的整条线段 = ${a} + ${d}。` });

  st.push({
    v: s3, b: B.bs(),
    ask: { q: `看图想一想：小红一共有多少 ${u}？`,
      opts: [`${b} ${u}`, `${a} ${u}`, `${d} ${u}`], a: 0 },
    hint: `小红 = 和小明一样多的 ${a} ${u} + 多出来的 ${d} ${u} = ${b} ${u}。`
  });

  B.add('r1v');
  const s4 = B.snap();
  st.push({ v: s4, b: B.bs(), say: `小红有 ${b} ${u}。这一段是「比」出来的，题目里并没有直接告诉你。` });

  B.add('r2l'); B.add('r2s0'); B.add('r2s1'); B.brace('bt');
  const s5 = B.snap();
  st.push({ v: s5, b: B.bs(), say: `题目问的是一共。把两条线段接起来，合起来就是总数。` });

  B.add('r2v');
  const s6 = B.snap();
  st.push({ v: s6, b: B.bs().filter(x => x !== 'bt'), eq: `${a} + ${b} = ${total}（${u}）`, eqCls: 'fin',
    say: `${a} + ${b} = ${total}（${u}）。线段图的好处：谁多谁少、一共多少，一眼看清，不用猜。` });

  return { rows, braces, steps: st, answer: `${total}${u}` };
}

/* ---- 和差 ---- */
function P_sumdiff(S, D, u){
  const small = (S - D) / 2, big = (S + D) / 2;
  const rows = [
    { id: 'r0', label: '小数', v: `${small}`, segs: [{ n: small, t: '小数', c: 'a' }] },
    { id: 'r1', label: '大数', v: `${big}`, segs: [{ n: small, t: '', c: 'a' }, { n: D, t: `+${D}`, c: 'b', ghost: 1 }] },
    { id: 'r2', label: '和', v: `${S}`, segs: [{ n: small, t: '', c: 'a' }, { n: big, t: '', c: 'b' }] },
    // 第 4 行是关键：把「差」补给小数，两段就一样长了 → 2 个大数
    { id: 'r3', label: '补上差', v: `${S + D}`, segs: [{ n: small, t: '', c: 'a' }, { n: big, t: '', c: 'b' }, { n: D, t: `+${D}`, c: 'b', ghost: 1 }] }
  ];
  const braces = [
    { id: 'bd', row: 1, u1: small, u2: small + D, label: `差 ${D}`, side: 'above', cls: 'diff' },
    { id: 'bs', row: 2, u1: 0, u2: S, label: `和 ${S}`, side: 'below', cls: 'total' },
    { id: 'bx', row: 3, u1: 0, u2: S + D, label: `${S} + ${D} = 两个大数`, side: 'below', cls: 'hi' }
  ];
  const B = builder();

  B.add('r0l'); B.add('r0s0');
  const s1 = B.snap();
  const st = [{ v: s1, say: `和是 ${S}，差是 ${D}。两条线段，长的叫大数，短的叫小数。先把短的那条画出来。` }];

  B.add('r1l'); B.add('r1s0');
  const s2 = B.snap();
  st.push({ v: s2, say: `大数比小数多，所以起点对齐、画得更长。长出来的那一段，就是差。` });

  B.add('r1s1'); B.brace('bd');
  const s3 = B.snap();
  st.push({ v: s3, b: B.bs(), say: `多出来这一段 = ${D}，这就是「差」。注意：差不是两个数，是一段长度。` });

  B.add('r2l'); B.add('r2s0'); B.add('r2s1'); B.brace('bs');
  const s4 = B.snap();
  st.push({ v: s4, b: B.bs(), say: `把小数和大数接起来，长度就是「和」= ${S}。` });

  st.push({
    v: s4, b: B.bs(),
    ask: { q: `关键一想：给小数也补上差那一段，两条就一样长了。这时合起来是多少？`,
      opts: [`${S + D}`, `${S}`, `${S - D}`], a: 0 },
    hint: `补上 ${D} 之后，两条都变成「大数」。原来的和 ${S} 再加 ${D}，正好是 2 个大数。`
  });

  B.add('r3l'); B.add('r3s0'); B.add('r3s1'); B.add('r3s2'); B.brace('bx');
  const s5 = B.snap();
  st.push({ v: s5, b: B.bs(), say: `补上这 ${D}：${S} + ${D} = ${S + D}。这条正好是两个大数拼起来。` });

  B.add('r3v');
  const s6 = B.snap();
  st.push({ v: s6, b: B.bs(), eq: `大数 = (${S} + ${D}) ÷ 2 = ${big}`,
    say: `所以 大数 =（和 + 差）÷ 2 =（${S} + ${D}）÷ 2 = ${big}。` });

  B.add('r0v'); B.add('r1v');
  const s7 = B.snap();
  st.push({ v: s7, b: B.bs(), eq: `小数 = ${big} − ${D} = ${small}`,
    say: `大数是 ${big}。小数 = ${big} − ${D} = ${small}，也可以直接用 ${S} − ${big} 得到。` });

  const s8 = B.snap();
  st.push({ v: s8, b: B.bs(), eq: `${small} + ${big} = ${S} ✓　${big} − ${small} = ${D} ✓`, eqCls: 'fin',
    say: `验算：${small} + ${big} = ${S}，${big} − ${small} = ${D}。和、差都对上了。` });

  return { rows, braces, steps: st, answer: `大数 ${big}，小数 ${small}` };
}

/* ---- 和倍 ---- */
function P_summul(S, n, u, one){
  const parts = n + 1;
  const mk = (cnt, cls, lab) => Array.from({ length: cnt }, (_, i) => ({ n: 1, t: i === 0 ? lab : '', c: cls }));
  const rows = [
    { id: 'r0', label: '小数', v: `${one}${u}`, segs: mk(1, 'a', '1 份'), div: 1 },
    { id: 'r1', label: '大数', v: `${one * n}${u}`, segs: mk(n, 'b', `${n} 份`), div: 1 },
    { id: 'r2', label: '和', v: `${S}${u}`, segs: [...mk(1, 'a', ''), ...mk(n, 'b', '')], div: 1 }
  ];
  const braces = [
    { id: 'bs', row: 2, u1: 0, u2: parts, label: `和 ${S}`, side: 'below', cls: 'total' },
    { id: 'bu', row: 0, u1: 0, u2: 1, label: `1 份 = ${one}`, side: 'above', cls: 'hi' }
  ];
  const B = builder();

  B.add('r0l'); B.add('r0s0');
  const s1 = B.snap();
  const st = [{ v: s1, say: `大数是小数的 ${n} 倍，意思是：把小数的长度当成「1 份」。先画这 1 份。` }];

  B.add('r1l'); B.addRow({ id: 'r1', segs: rows[1].segs });
  const s2 = B.snap();
  st.push({ v: s2, say: `大数就是 ${n} 个这样的 1 份，一格一格接起来画。` });

  B.add('r2l'); B.addRow({ id: 'r2', segs: rows[2].segs }); B.brace('bs');
  const s3 = B.snap();
  st.push({ v: s3, b: B.bs(), say: `把两段接起来，一共 ${parts} 份，这 ${parts} 份的长度就是「和」= ${S}。` });

  st.push({
    v: s3, b: B.bs(),
    ask: { q: `${parts} 份合起来是 ${S}，那 1 份是多少？`,
      opts: [`${one}`, `${one * 2}`, `${S}`], a: 0 },
    hint: `把 ${S} 平均分成 ${parts} 份：${S} ÷ ${parts} = ${one}。这就是 1 份。`
  });

  B.brace('bu');
  const s4 = B.snap();
  st.push({ v: s4, b: B.bs(), eq: `1 份 = ${S} ÷ ${parts} = ${one}`,
    say: `1 份 = ${S} ÷ ${parts} = ${one}。而小数正好就是 1 份。` });

  B.add('r0v'); B.add('r1v');
  const s5 = B.snap();
  st.push({ v: s5, b: B.bs(), eq: `小数 = ${one}，大数 = ${one} × ${n} = ${one * n}`,
    say: `小数 = ${one}，大数 = ${one} × ${n} = ${one * n}。` });

  const s6 = B.snap();
  st.push({ v: s6, b: B.bs(), eq: `${one} + ${one * n} = ${S} ✓`, eqCls: 'fin',
    say: `验算：${one} + ${one * n} = ${S}，正好是题目的和。` });

  return { rows, braces, steps: st, answer: `小数 ${one}，大数 ${one * n}` };
}

/* ---- 差倍 ---- */
function P_diffmul(D, n, u, one){
  const parts = n - 1;
  const mk = (cnt, cls, lab) => Array.from({ length: cnt }, (_, i) => ({ n: 1, t: i === 0 ? lab : '', c: cls }));
  const rows = [
    { id: 'r0', label: '小数', v: `${one}${u}`, segs: mk(1, 'a', '1 份'), div: 1 },
    { id: 'r1', label: '大数', v: `${one * n}${u}`, segs: mk(n, 'b', `${n} 份`), div: 1 }
  ];
  const braces = [
    { id: 'bd', row: 1, u1: 1, u2: n, label: `差 ${D} = ${parts} 份`, side: 'above', cls: 'diff' },
    { id: 'bu', row: 0, u1: 0, u2: 1, label: `1 份 = ${one}`, side: 'below', cls: 'hi' }
  ];
  const B = builder();

  B.add('r0l'); B.add('r0s0');
  const s1 = B.snap();
  const st = [{ v: s1, say: `大数是小数的 ${n} 倍。把小数的长度当成 1 份，先画这 1 份。` }];

  B.add('r1l'); B.addRow({ id: 'r1', segs: rows[1].segs });
  const s2 = B.snap();
  st.push({ v: s2, say: `大数画 ${n} 个 1 份。两条起点对齐，大数就比小数长出 ${parts} 份。` });

  B.brace('bd');
  const s3 = B.snap();
  st.push({ v: s3, b: B.bs(), say: `长出来的这 ${parts} 份，长度就是「差」= ${D}。注意：差对应 ${parts} 份，不是 ${n} 份。` });

  st.push({
    v: s3, b: B.bs(),
    ask: { q: `${parts} 份合起来是 ${D}，那 1 份是多少？`,
      opts: [`${one}`, `${one * 2}`, `${D}`], a: 0 },
    hint: `把 ${D} 平均分成 ${parts} 份：${D} ÷ ${parts} = ${one}。`
  });

  B.brace('bu');
  const s4 = B.snap();
  st.push({ v: s4, b: B.bs(), eq: `1 份 = ${D} ÷ ${parts} = ${one}`,
    say: `1 份 = ${D} ÷ ${parts} = ${one}。小数就是 1 份，所以小数 = ${one}。` });

  B.add('r0v'); B.add('r1v');
  const s5 = B.snap();
  st.push({ v: s5, b: B.bs(), eq: `大数 = ${one} × ${n} = ${one * n}`,
    say: `大数 = ${one} × ${n} = ${one * n}。` });

  const s6 = B.snap();
  st.push({ v: s6, b: B.bs(), eq: `${one * n} − ${one} = ${D} ✓　${one * n} ÷ ${one} = ${n} ✓`, eqCls: 'fin',
    say: `验算：${one * n} − ${one} = ${D}，而且 ${one * n} ÷ ${one} = ${n}。差和倍数都对上了。` });

  return { rows, braces, steps: st, answer: `小数 ${one}，大数 ${one * n}` };
}

/* =========================================================
   布局：把「份」换算成像素
   ========================================================= */
function buildModel(model){
  const W = 432, PADL = 54, PADR = 62, BARH = 28, GAPY = 74, TOP = 46, EQH = 46;
  const avail = W - PADL - PADR;

  let maxU = 0;
  model.rows.forEach(r => { maxU = Math.max(maxU, r.segs.reduce((a, b) => a + b.n, 0)); });
  model.braces.forEach(b => { maxU = Math.max(maxU, b.u2); });
  const scale = avail / maxU;

  const nRows = model.rows.length;
  const H = TOP + nRows * GAPY + EQH;
  const rowTop = i => TOP + i * GAPY;

  let s = `<svg viewBox="0 0 ${W} ${H}">`;

  model.rows.forEach((row, i) => {
    const y = rowTop(i);
    s += `<text class="rlabel" id="${row.id}l" x="${PADL - 9}" y="${y + BARH / 2 + 4}">${row.label}</text>`;

    let acc = 0;
    row.segs.forEach((seg, j) => {
      const x = PADL + acc * scale;
      const w = seg.n * scale;
      acc += seg.n;

      const fill = seg.c === 'a' ? '#c9d8ff' : '#ffd7b5';
      const stroke = seg.c === 'a' ? '#8fb0f5' : '#f0b184';
      s += `<rect class="bar${seg.ghost ? ' gst' : ''}" id="${row.id}s${j}" x="${x}" y="${y}"
              width="${Math.max(w, 1.5)}" height="${BARH}" rx="4"
              fill="${fill}" stroke="${stroke}" stroke-width="1.2"
              style="transition-delay:${j * 70}ms"/>`;

      if(row.div && j > 0){
        s += `<line class="divider" id="${row.id}d${j}" x1="${x}" y1="${y + 2}" x2="${x}" y2="${y + BARH - 2}"
                style="transition-delay:${j * 70 + 120}ms"/>`;
      }
      if(seg.t && w >= 34){
        s += `<text class="btext ${seg.c}" id="${row.id}t${j}" x="${x + w / 2}" y="${y + BARH / 2 + 4}">${seg.t}</text>`;
      }
    });

    // 结果统一右对齐在固定的一列里，绝不会和线段互相压住
    s += `<text class="vcol" id="${row.id}v" x="${W - 10}" y="${y + BARH / 2 + 4}">${row.v || ''}</text>`;
  });

  const stackCount = {};
  model.braces.forEach(b => {
    const row = model.rows[b.row];
    const y = rowTop(b.row);
    const x1 = PADL + b.u1 * scale;
    const x2 = PADL + b.u2 * scale;
    const above = b.side === 'above';
    const key = b.row + b.side;
    const depth = stackCount[key] || 0;
    stackCount[key] = depth + 1;
    const yBase = (above ? y - 8 : y + BARH + 8) + (above ? -1 : 1) * depth * 21;
    const dir = above ? -1 : 1;
    const d = `M ${x1} ${yBase} L ${x1} ${yBase + dir * 7} L ${x2} ${yBase + dir * 7} L ${x2} ${yBase}`;
    const ty = yBase + dir * 20;
    s += `<g class="brace ${b.cls}" id="${b.id}"><path d="${d}"/><text x="${(x1 + x2) / 2}" y="${ty}">${b.label}</text></g>`;
  });

  const eqY = TOP + nRows * GAPY + 8;
  s += `<text class="eqline" id="eq" x="${W / 2}" y="${eqY}"></text>`;
  s += `<text class="eqline fin" id="eqf" x="${W / 2}" y="${eqY + 19}"></text>`;

  s += `</svg>`;
  return s;
}

/* =========================================================
   状态机
   ========================================================= */
const KINDS = {
  more:    { fields: [['a', '小明', 12], ['d', '多出', 5]] },
  sumdiff: { fields: [['S', '和', 29], ['D', '差', 5]] },
  summul:  { fields: [['S', '和', 36], ['n', '倍数', 3]] },
  diffmul: { fields: [['D', '差', 24], ['n', '倍数', 4]] }
};

let kind = 'more', cur = null, idx = 0, answers = {}, timer = null;

const $ = s => document.querySelector(s);
const board = $('#board'), stepList = $('#stepList'), dotsEl = $('#dots'), askHost = $('#askHost'), notice = $('#notice');

function renderFields(){
  $('#fields').innerHTML = KINDS[kind].fields.map(([key, label, def]) =>
    `<div class="field"><label>${label}</label><input id="f_${key}" type="number" value="${def}" min="1" max="999"/></div>`
  ).join('');
  $('#fields').querySelectorAll('input').forEach(inp => {
    inp.onkeydown = e => { if(e.key === 'Enter') run(); };
  });
}

function readParams(){
  const v = {};
  KINDS[kind].fields.forEach(([key]) => {
    v[key] = Math.max(1, Math.min(999, Math.round(+$('#f_' + key).value || 1)));
  });
  return v;
}

function run(){
  const v = readParams();
  let model, warn = '';

  if(kind === 'more'){
    if(v.d > v.a * 2){ v.d = v.a; warn = `多出的部分太大，图会失衡，已调整为 ${v.d}。`; }
    model = P_more(v.a, v.d, UNIT);
  }
  else if(kind === 'sumdiff'){
    if((v.S - v.D) % 2 !== 0){ v.S += 1; warn = `为了小数是整数，和自动调成 ${v.S}（和与差必须同奇偶）。`; }
    if(v.D >= v.S){ v.D = Math.max(1, Math.floor(v.S / 3)); warn = `差必须比和小，已把差调成 ${v.D}。`; }
    model = P_sumdiff(v.S, v.D, UNIT);
  }
  else if(kind === 'summul'){
    const parts = v.n + 1;
    const fixed = Math.max(parts, Math.round(v.S / parts) * parts);
    if(fixed !== v.S){ v.S = fixed; warn = `为了 1 份是整数，和自动调成 ${v.S}（要是 ${parts} 的倍数）。`; }
    model = P_summul(v.S, v.n, UNIT, v.S / parts);
  }
  else {
    const n = Math.max(2, v.n), parts = n - 1;
    v.n = n;
    const fixed = Math.max(parts, Math.round(v.D / parts) * parts);
    if(fixed !== v.D){ v.D = fixed; warn = `为了 1 份是整数，差自动调成 ${v.D}（要是 ${parts} 的倍数）。`; }
    model = P_diffmul(v.D, n, UNIT, v.D / parts);
  }

  // 回写到输入框，让用户看到真实参数
  KINDS[kind].fields.forEach(([key]) => { if(v[key] !== undefined) $('#f_' + key).value = v[key]; });

  notice.textContent = warn;
  notice.classList.toggle('on', !!warn);

  board.innerHTML = buildModel(model);

  const withAsk = $('#chkAsk').checked;
  cur = { model, steps: model.steps.filter(s => withAsk || !s.ask) };
  answers = {}; idx = 0;
  buildStepList();
  paint();
  renderJson();
}

function buildStepList(){
  stepList.innerHTML = ''; dotsEl.innerHTML = '';
  cur.steps.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'stepitem' + (s.ask ? ' ask' : '');
    d.innerHTML = `<span class="n">${s.ask ? '?' : (i + 1)}</span><span>${s.ask ? s.ask.q : s.say}</span>`;
    d.onclick = () => { idx = i; paint(); };
    stepList.appendChild(d);
    const dot = document.createElement('i');
    dot.onclick = () => { idx = i; paint(); };
    dotsEl.appendChild(dot);
  });
}

function paint(){
  const s = cur.steps[idx];
  const vis = new Set(s.v || []);
  const brc = new Set(s.b || []);

  document.querySelectorAll('.bar').forEach(el => el.classList.toggle('on', vis.has(el.id)));
  document.querySelectorAll('.divider').forEach(el => el.classList.toggle('on', vis.has(el.id)));
  document.querySelectorAll('.rlabel').forEach(el => el.classList.toggle('on', vis.has(el.id)));
  // 线段内文字跟随它所属的那一段显示（rXtY -> rXsY）
  document.querySelectorAll('.btext').forEach(el => {
    let on = vis.has(el.id);
    const m = el.id.match(/^r(\d)t(\d)$/);
    if(m) on = vis.has(`r${m[1]}s${m[2]}`);
    el.classList.toggle('on', on);
  });
  document.querySelectorAll('.vcol').forEach(el => el.classList.toggle('on', vis.has(el.id)));
  document.querySelectorAll('.brace').forEach(el => el.classList.toggle('on', brc.has(el.id)));

  const eq = $('#eq'), eqf = $('#eqf');
  if(eq){ eq.textContent = s.eq || ''; eq.classList.toggle('on', !!s.eq); }
  if(eqf){ eqf.textContent = s.eqCls === 'fin' ? (s.eq || '') : ''; eqf.classList.toggle('on', s.eqCls === 'fin'); }
  if(eq && s.eqCls === 'fin'){ eq.textContent = ''; eq.classList.remove('on'); }

  $('#narrK').textContent = s.ask ? '想一想' : '第 ' + (idx + 1) + ' 步';
  $('#narrT').textContent = s.ask ? '先自己看图算一遍，再选下面的答案。' : s.say;

  if(s.ask){
    const done = answers[idx];
    askHost.innerHTML = `<div class="askcard ${done ? 'ok' : ''}">
      <div class="askq"><span>${done ? '答对了' : '想一想'}</span>${s.ask.q}</div>
      <div class="opts">${s.ask.opts.map((o, k) =>
        `<button class="opt ${done && k === s.ask.a ? 'right' : ''} ${answers[idx + '-' + k] ? 'wrong' : ''}" data-k="${k}">${o}</button>`
      ).join('')}</div>
      ${done ? `<div style="margin-top:10px;font-size:11.5px;line-height:1.65;color:#0b7d52;background:rgba(15,157,103,.08);padding:8px 10px;border-radius:9px">${s.hint || ''}</div>` : ''}
    </div>`;
    askHost.querySelectorAll('.opt').forEach(b => {
      b.onclick = () => {
        const k = +b.dataset.k;
        if(k === s.ask.a) answers[idx] = true; else answers[idx + '-' + k] = true;
        paint();
      };
    });
  }else{
    askHost.innerHTML = '';
  }

  [...stepList.children].forEach((d, i) => d.classList.toggle('on', i === idx));
  [...dotsEl.children].forEach((d, i) => {
    d.classList.toggle('on', i === idx);
    d.classList.toggle('done', i < idx);
  });
  $('#btnPrev').disabled = idx === 0;
  $('#btnNext').disabled = idx === cur.steps.length - 1;

  const on = document.querySelector('.stepitem.on');
  if(on) on.scrollIntoView({ block: 'nearest' });
}

function renderJson(){
  const v = readParams();
  const params = Object.entries(v).map(([k, val]) => `    <span class="k">"${k}"</span>: <span class="n">${val}</span>`).join(',\n');
  $('#json').innerHTML =
`<span class="c">// 模型只需判断题型 + 抽参数</span>
{
  <span class="k">"template"</span>: <span class="s">"bar-model"</span>,
  <span class="k">"kind"</span>: <span class="s">"${kind}"</span>,
  <span class="k">"params"</span>: {
${params}
  }
}

<span class="c">// 引擎推导</span>
{
  <span class="k">"rows"</span>: <span class="n">${cur.model.rows.length}</span>,
  <span class="k">"steps"</span>: <span class="n">${cur.steps.length}</span>,
  <span class="k">"answer"</span>: <span class="s">"${cur.model.answer}"</span>
}`;
}

/* ---- 事件 ---- */
$('#kinds').onclick = e => {
  const b = e.target.closest('button');
  if(!b) return;
  kind = b.dataset.k;
  $('#kinds').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  renderFields();
  run();
};

$('#btnRun').onclick = run;
$('#chkAsk').onchange = run;
$('#chkAuto').onchange = toggleAuto;

$('#btnRand').onclick = () => {
  if(kind === 'more'){
    $('#f_a').value = 4 + Math.floor(Math.random() * 28);
    $('#f_d').value = 1 + Math.floor(Math.random() * 12);
  }else if(kind === 'sumdiff'){
    const small = 3 + Math.floor(Math.random() * 26), D = 1 + Math.floor(Math.random() * 16);
    $('#f_S').value = 2 * small + D; $('#f_D').value = D;
  }else if(kind === 'summul'){
    const one = 2 + Math.floor(Math.random() * 16), n = 2 + Math.floor(Math.random() * 4);
    $('#f_S').value = one * (n + 1); $('#f_n').value = n;
  }else{
    const one = 2 + Math.floor(Math.random() * 16), n = 2 + Math.floor(Math.random() * 4);
    $('#f_D').value = one * (n - 1); $('#f_n').value = n;
  }
  run();
};

$('#btnPrev').onclick = () => { if(idx > 0){ idx--; paint(); } };
$('#btnNext').onclick = () => {
  const s = cur.steps[idx];
  if(s.ask && !answers[idx]) return;
  if(idx < cur.steps.length - 1){ idx++; paint(); }
};

document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  if(e.key === 'ArrowRight') $('#btnNext').click();
  if(e.key === 'ArrowLeft') $('#btnPrev').click();
});

function toggleAuto(){
  clearInterval(timer);
  if($('#chkAuto').checked){
    timer = setInterval(() => {
      if(idx >= cur.steps.length - 1){ idx = 0; paint(); return; }
      const s = cur.steps[idx];
      if(s.ask && !answers[idx]) return;
      idx++; paint();
    }, 1900);
  }
}

/* =========================================================
   自检：随机参数必须满足题目约束
   ========================================================= */
(function selfCheck(){
  let bad = 0, total = 0;
  for(let t = 0; t < 300; t++){
    {
      const a = 3 + Math.floor(Math.random() * 40), d = 1 + Math.floor(Math.random() * 25);
      const m = P_more(a, d, UNIT);
      total++; if(parseInt(m.answer, 10) !== a + (a + d)) bad++;
    }
    {
      const small = 2 + Math.floor(Math.random() * 40), D = 1 + Math.floor(Math.random() * 25);
      const S = 2 * small + D;
      const [big, sm] = P_sumdiff(S, D, UNIT).answer.match(/\d+/g).map(Number);
      total++; if(big + sm !== S || big - sm !== D) bad++;
    }
    {
      const one = 2 + Math.floor(Math.random() * 20), n = 2 + Math.floor(Math.random() * 5);
      const S = one * (n + 1);
      const [sm, big] = P_summul(S, n, UNIT, one).answer.match(/\d+/g).map(Number);
      total++; if(sm + big !== S || big !== sm * n) bad++;
    }
    {
      const one = 2 + Math.floor(Math.random() * 20), n = 2 + Math.floor(Math.random() * 5);
      const D = one * (n - 1);
      const [sm, big] = P_diffmul(D, n, UNIT, one).answer.match(/\d+/g).map(Number);
      total++; if(big - sm !== D || big !== sm * n) bad++;
    }
  }
  $('#selfcheck').innerHTML = bad === 0
    ? `<b>自检通过</b>　四类题型各 300 组随机参数，答案全部满足题目约束。<br/>段数、比例、差值都由参数推导，不会"画歪"也不会"算错"。`
    : `<span style="color:#c0392b">自检失败 ${bad} / ${total}</span>`;
})();

/* ---- 深链 ---- */
(function deep(){
  const q = new URLSearchParams(location.hash.slice(1));
  if(q.get('k') && KINDS[q.get('k')]) kind = q.get('k');
  $('#kinds').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.k === kind));
  renderFields();
  KINDS[kind].fields.forEach(([key]) => {
    if(q.get(key)) $('#f_' + key).value = q.get(key);
  });
})();

renderFields();
run();

(function jump(){
  const q = new URLSearchParams(location.hash.slice(1));
  if(q.get('s')){
    idx = Math.min(+q.get('s'), cur.steps.length - 1);
    paint();
  }
})();
</script>
